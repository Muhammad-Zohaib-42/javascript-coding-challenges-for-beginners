<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotating gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section>
        <h1>Gallery</h1>
        <div class="gallery">
            <div class="frame" style="--i:1">
                <img src="images/lake.jpg" alt="nature image">
            </div>
            <div class="frame" style="--i:2">
                <img src="images/mountains.jpg" alt="nature image">
            </div>
            <div class="frame" style="--i:3">
                <img src="images/mountains2.jpg" alt="nature image">
            </div>
            <div class="frame" style="--i:4">
                <img src="images/mountains.jpg" alt="nature image">
            </div>
            <div class="frame" style="--i:5">
                <img src="images/lake.jpg" alt="nature image">
            </div>
            <div class="frame" style="--i:6">
                <img src="images/mountains.jpg" alt="nature image">
            </div>
        </div>
        <div class="controls">
            <button>Previous</button>
            <button>Next</button>
        </div>
    </section>
</body>
</html>
