<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image-hover-effect</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <section>
            <div class="container">
                <div class="frame first">
                    <img src="images/lake.jpg" alt="lake image">
                </div>
                <div class="frame middle">
                    <img src="images/mountains.jpg" alt="mountains image">
                </div>
                <div class="frame end">
                    <img src="images/mountains2.jpg" alt="mountains2 image">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
