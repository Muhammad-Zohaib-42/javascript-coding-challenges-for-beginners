<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section>
        <div>
            <div class="top">
                <div class="bar-circle">1 <div class="bar"><div class="bar-inner"></div></div></div>
                <div class="bar-circle">2 <div class="bar"><div class="bar-inner"></div></div></div>
                <div class="bar-circle">3 <div class="bar"><div class="bar-inner"></div></div></div>
                <div class="bar-circle">4 <div class="bar"><div class="bar-inner"></div></div></div>
                <div class="bar-circle">5</div>
            </div>
            <div class="btns-wrapper">
                <button>Previous</button>
                <button>Next</button>
            </div>
        </div>
    </section>
</body>
</html>
