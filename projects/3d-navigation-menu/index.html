<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d navigation menu</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <button class="menu">
            <div class="line start"></div>
            <div class="line middle"></div>
            <div class="line end"></div>
        </button>
        <nav>
            <ul>
                <li><button class="link">Home</button></li>
                <li><button class="link">Project</button></li>
                <li><button class="link">About</button></li>
            </ul>
        </nav>
        <section class="about">
            <h1>About</h1>
        </section>
        <section class="project">
            <h1>Project</h1>
        </section>
        <section class="home">
            <h1>Home</h1>
        </section>
    </main>
</body>
</html>
